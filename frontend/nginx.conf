server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- react-router-dom routes like /claims/5 have no
    # matching file on disk, so nginx must serve index.html for any path
    # it doesn't recognize and let the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
