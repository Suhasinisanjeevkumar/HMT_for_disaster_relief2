<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMT — Hyperlocal Misinformation Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e8e0cc; --paper-dark:#ddd3ba; --card:#f3ede0; --card-hi:#faf6ea;
    --ink:#2b2620; --ink-soft:#5a5346;
    --verified:#2f6b4f; --verified-bg:#dfe8de;
    --fake:#a63a2e; --fake-bg:#ecdcd6;
    --flood:#2c5c73; --flood-bg:#dde6ea;
    --amber:#a8721f; --amber-bg:#f1e2c4;
    --rule:#c9bc9c;
    --shadow: 2px 3px 0 rgba(43,38,32,0.12);
    --shadow-lg: 3px 5px 0 rgba(43,38,32,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(43,38,32,0.025) 0px, transparent 1px, transparent 3px),
      var(--paper);
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{ font-family:inherit; }
  a{color:inherit;}
  :focus-visible{ outline:2px solid var(--flood); outline-offset:2px; }

  /* top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper); border-bottom:1px solid var(--rule);
    padding:0.9rem 1.5rem;
  }
  .topbar-inner{max-width:1180px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:0.6em;}
  .brand .mark{font-family:'Special Elite', monospace; font-size:13px; color:var(--flood); letter-spacing:0.08em;}
  .brand .name{font-family:'Fraunces', serif; font-weight:700; font-size:19px;}
  .tabs{display:flex; gap:0.3rem;}
  .tab{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.03em;
    padding:0.5rem 0.9rem; border:1px solid var(--rule); background:var(--card);
    cursor:pointer; color:var(--ink-soft); border-radius:2px 2px 0 0;
  }
  .tab.active{ background:var(--card-hi); color:var(--ink); border-bottom-color:var(--card-hi); font-weight:600; box-shadow: 0 -2px 0 var(--flood) inset; }
  .tab:hover:not(.active){ background:var(--paper-dark); }

  .wrap{max-width:1180px; margin:0 auto; padding:2.2rem 1.5rem 5rem;}
  .eyebrow{ font-family:'Special Elite', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--flood); display:flex; align-items:center; gap:0.6em; }
  .eyebrow::before{content:"◆"; font-size:9px;}
  h1{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(26px,3.6vw,40px); line-height:1.05; margin:0.35em 0 0.2em; letter-spacing:-0.01em; }
  h2{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0 0 0.5em; }
  .sub{color:var(--ink-soft); font-size:14.5px; max-width:62ch; margin-bottom:1.6rem;}

  .note{ position:relative; background:#f6efd8; border:1px solid var(--rule); box-shadow:var(--shadow); padding:1.3rem 1.4rem 1.4rem; margin:0 0 2rem; max-width:840px; transform:rotate(-0.35deg); }
  .note::before{ content:"PINNED NOTE"; position:absolute; top:-11px; left:22px; background:var(--amber-bg); color:var(--amber); font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em; font-weight:600; padding:2px 8px; border:1px solid var(--rule); }
  .note h3{ font-family:'Special Elite', monospace; font-size:13.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--fake); margin:0.2em 0 0.6em; }
  .note p{margin:0 0 0.6em; font-size:14px;} .note p:last-child{margin-bottom:0;}
  .note .tag{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:var(--fake-bg); color:var(--fake); padding:1px 6px; border-radius:2px; }

  .section-title{ font-family:'Special Elite', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-soft); display:flex; align-items:center; gap:0.8em; margin:0 0 1rem; }
  .section-title::after{content:""; flex:1; height:1px; background:var(--rule);}

  /* stat strip */
  .strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule); border:1px solid var(--rule); margin-bottom:2rem; }
  .stat{background:var(--card); padding:1.1rem 1.2rem;}
  .stat .num{font-family:'IBM Plex Mono', monospace; font-size:25px; font-weight:600;}
  .stat .lbl{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}
  @media (max-width:700px){ .strip{grid-template-columns:1fr 1fr;} }

  /* bars (dataset composition, no chart lib) */
  .bar-row{ display:grid; grid-template-columns:130px 1fr 44px; align-items:center; gap:0.7em; font-size:12.5px; margin-bottom:0.45rem; }
  .bar-row .bl{ color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{ height:9px; background:var(--paper-dark); border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--flood); border-radius:2px; }
  .bar-fill.fake{ background:var(--fake); }
  .bar-row .bv{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-align:right; color:var(--ink-soft); }

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:1.8rem; align-items:start;}
  @media (max-width:880px){ .grid2{grid-template-columns:1fr;} }

  .side-block{ background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); padding:1.1rem 1.2rem 1.3rem; margin-bottom:1.4rem; }
  .cm-table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:12.5px; margin-top:0.5rem;}
  .cm-table th,.cm-table td{border:1px solid var(--rule); padding:6px 8px; text-align:center;}
  .cm-table th{background:var(--paper-dark); font-weight:600; font-size:10px; text-transform:uppercase;}
  .cm-table td.hit{background:var(--verified-bg); color:var(--verified); font-weight:600;}
  .cm-table td.miss{background:var(--fake-bg); color:var(--fake); font-weight:600;}
  .roadmap-item{font-size:13px; padding:6px 0; border-bottom:1px dashed var(--rule); display:flex; gap:0.6em;}
  .roadmap-item:last-child{border-bottom:none;}
  .roadmap-item .dot{width:6px; height:6px; border-radius:50%; background:var(--rule); margin-top:6px; flex-shrink:0;}
  .roadmap-item.next .dot{background:var(--flood);}

  /* feed */
  .filters{ display:flex; flex-wrap:wrap; gap:0.6rem; margin-bottom:1.2rem; align-items:center; }
  .filters input[type=search]{ flex:1; min-width:180px; padding:0.55rem 0.8rem; border:1px solid var(--rule); background:var(--card); font-size:13px; border-radius:2px; }
  .filters select{ padding:0.55rem 0.6rem; border:1px solid var(--rule); background:var(--card); font-size:12.5px; border-radius:2px; }
  .filters .count{font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  .card{ background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); padding:1rem 1.15rem 1.1rem; margin-bottom:0.85rem; cursor:pointer; transition:transform 0.1s ease; }
  .card:hover{ background:var(--card-hi); transform:translate(-1px,-1px); box-shadow:var(--shadow-lg); }
  .card.wrong{ border-color:var(--amber); box-shadow:2px 3px 0 rgba(168,114,31,0.25); }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:0.5rem;}
  .exhibit{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft);}
  .stamp{ font-family:'Special Elite', monospace; font-size:10.5px; letter-spacing:0.07em; text-transform:uppercase; padding:2px 7px; border:1.5px solid; border-radius:2px; transform:rotate(-3deg); white-space:nowrap; }
  .stamp.true{color:var(--verified); border-color:var(--verified); background:var(--verified-bg);}
  .stamp.fake{color:var(--fake); border-color:var(--fake); background:var(--fake-bg);}
  .claim-text{font-size:14.5px; margin:0.35rem 0 0.6rem;}
  .meta-row{ display:flex; flex-wrap:wrap; gap:0.4em 1em; font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--ink-soft); border-top:1px dashed var(--rule); padding-top:0.5rem; }
  .verdict-row{ display:flex; align-items:center; gap:0.6em; margin-top:0.55rem; font-size:12px; }
  .prob-bar{flex:1; height:6px; background:var(--paper-dark); position:relative; border-radius:3px; overflow:hidden;}
  .prob-fill{position:absolute; left:0; top:0; bottom:0; background:var(--flood); border-radius:3px;}
  .load-more{ display:block; margin:1rem auto 0; padding:0.6rem 1.4rem; background:var(--card); border:1px solid var(--rule); font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer; border-radius:2px; }
  .load-more:hover{ background:var(--paper-dark); }

  /* detail */
  .back-link{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--flood); cursor:pointer; display:inline-flex; gap:0.4em; align-items:center; margin-bottom:1rem; background:none; border:none; padding:0; }
  .back-link:hover{ text-decoration:underline; }
  .detail-card{ background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow-lg); padding:1.6rem 1.7rem; margin-bottom:1.6rem; }
  .gauge-wrap{ display:flex; gap:1.6rem; align-items:center; flex-wrap:wrap; margin:1.2rem 0; }
  .token{ display:inline-block; padding:2px 7px; margin:2px 3px 2px 0; border-radius:2px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .token.pos{ background:var(--verified-bg); color:var(--verified); }
  .token.neg{ background:var(--fake-bg); color:var(--fake); }

  /* try it */
  .try-box{ background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); padding:1.4rem 1.5rem; }
  textarea{ width:100%; min-height:110px; padding:0.8rem; border:1px solid var(--rule); background:var(--card-hi); font-size:14.5px; border-radius:2px; resize:vertical; }
  .analyze-btn{ margin-top:0.8rem; padding:0.65rem 1.4rem; background:var(--flood); color:var(--card-hi); border:none; font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.03em; cursor:pointer; border-radius:2px; }
  .analyze-btn:hover{ opacity:0.9; }
  .analyze-btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .try-result{ margin-top:1.3rem; padding-top:1.2rem; border-top:1px dashed var(--rule); }

  footer{margin-top:2.5rem; padding-top:1.1rem; border-top:1px solid var(--rule); font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace;}
  .empty{ color:var(--ink-soft); font-size:13.5px; padding:1.5rem 0; }

  @media (prefers-reduced-motion: no-preference){ .card, .detail-card{ animation: settle 0.35s ease-out backwards; } }
  @keyframes settle{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
</style>
</head>

<script>
const FEED = JSON.parse(document.getElementById('data-feed').textContent);
const MODEL = JSON.parse(document.getElementById('data-model').textContent);
const STOPWORDS = new Set(JSON.parse(document.getElementById('data-stopwords').textContent));
const OVERVIEW = JSON.parse(document.getElementById('data-overview').textContent);

const VOCAB_INDEX = new Map();
MODEL.vocab.forEach((term, i) => VOCAB_INDEX.set(term, i));

const state = { view: 'overview', selected: null, feedLimit: 24, filters: { q: '', category: 'all', verdict: 'all' } };

// ---------- real client-side inference using the actual trained TF-IDF + LogisticRegression ----------
function tokenize(text) {
  const raw = (text.toLowerCase().match(/\b[a-z0-9][a-z0-9]+\b/g) || []);
  return raw.filter(t => !STOPWORDS.has(t));
}
function scoreText(text) {
  const toks = tokenize(text);
  const grams = [...toks];
  for (let i = 0; i < toks.length - 1; i++) grams.push(toks[i] + ' ' + toks[i+1]);

  const counts = new Map();
  grams.forEach(g => { if (VOCAB_INDEX.has(g)) counts.set(g, (counts.get(g) || 0) + 1); });

  const tfidf = new Map();
  let normSq = 0;
  counts.forEach((c, term) => {
    const idx = VOCAB_INDEX.get(term);
    const v = c * MODEL.idf[idx];
    tfidf.set(term, v);
    normSq += v * v;
  });
  const norm = Math.sqrt(normSq) || 1;

  let z = MODEL.intercept;
  const contributions = [];
  tfidf.forEach((v, term) => {
    const idx = VOCAB_INDEX.get(term);
    const normed = v / norm;
    const contrib = normed * MODEL.coef[idx];
    z += contrib;
    contributions.push({ term, contrib });
  });
  const prob = 1 / (1 + Math.exp(-z));
  contributions.sort((a,b) => Math.abs(b.contrib) - Math.abs(a.contrib));
  return { prob, contributions: contributions.slice(0, 8), matchedTerms: counts.size };
}

// ---------- rendering ----------
function fmtPct(p){ return Math.round(p * 100) + '%'; }

function gaugeSVG(prob, size=140){
  const r = 58, c = 2*Math.PI*r;
  const off = c - prob*c;
  const color = prob >= 0.5 ? 'var(--verified)' : 'var(--fake)';
  const label = prob >= 0.5 ? 'Leans True' : 'Leans Fake';
  return `<div style="position:relative; width:${size}px; height:${size}px;">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--paper-dark)" stroke-width="9"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <span style="font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;">${fmtPct(prob)}</span>
      <span style="font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;">${label}</span>
    </div>
  </div>`;
}

function renderOverview(){
  const catEntries = Object.entries(OVERVIEW.category_counts).sort((a,b)=>b[1]-a[1]);
  const srcEntries = Object.entries(OVERVIEW.source_counts).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const maxCat = Math.max(...catEntries.map(e=>e[1]));
  const maxSrc = Math.max(...srcEntries.map(e=>e[1]));

  return `
    <div class="eyebrow">Hyperlocal Misinformation Tracker — Prototype Build</div>
    <h1>Dataset &amp; Model Overview</h1>
    <p class="sub">A static research prototype built on IFND, filtered to disaster-relevant claims. No live ingestion is running — this page reports on what's actually been trained and measured so far.</p>

    <div class="note">
      <h3>⚠ On the accuracy numbers below</h3>
      <p>The classifier scores <span class="tag">${fmtPct(OVERVIEW.accuracy)} accuracy</span> on held-out test data — but that's inflated. IFND's source column predicts the label almost perfectly on its own (fact-checker outlets ≈100% "Fake," mainstream outlets ≈100% "TRUE"), so the model partly learned to recognize <em>fact-check headline phrasing</em> rather than the underlying truth of each claim.</p>
      <p>The real test happens once this runs against plain Reddit/Telegram text, which won't carry that framing. Try the <strong>Try It</strong> tab with your own wording to see this in action.</p>
    </div>

    <div class="strip">
      <div class="stat"><div class="num">${OVERVIEW.total_ifnd.toLocaleString()}</div><div class="lbl">Total IFND claims</div></div>
      <div class="stat"><div class="num">${OVERVIEW.disaster_subset}</div><div class="lbl">Disaster-relevant</div></div>
      <div class="stat"><div class="num">${fmtPct(OVERVIEW.accuracy)}</div><div class="lbl">Test accuracy *</div></div>
      <div class="stat"><div class="num">${OVERVIEW.test_size}</div><div class="lbl">Held-out test set</div></div>
    </div>

    <div class="grid2">
      <div>
        <div class="section-title">Claims by category</div>
        <div class="side-block">
          ${catEntries.map(([k,v]) => `
            <div class="bar-row">
              <span class="bl">${k}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100).toFixed(0)}%"></div></div>
              <span class="bv">${v}</span>
            </div>`).join('')}
        </div>

        <div class="section-title">Top sources</div>
        <div class="side-block">
          ${srcEntries.map(([k,v]) => `
            <div class="bar-row">
              <span class="bl">${k}</span>
              <div class="bar-track"><div class="bar-fill fake" style="width:${(v/maxSrc*100).toFixed(0)}%"></div></div>
              <span class="bv">${v}</span>
            </div>`).join('')}
        </div>
      </div>

      <div>
        <div class="section-title">Confusion matrix</div>
        <div class="side-block">
          <table class="cm-table">
            <tr><th></th><th>Pred. Fake</th><th>Pred. True</th></tr>
            <tr><th>Actual Fake</th><td class="hit">${OVERVIEW.confusion_matrix.fake_fake}</td><td class="miss">${OVERVIEW.confusion_matrix.fake_true}</td></tr>
            <tr><th>Actual True</th><td class="miss">${OVERVIEW.confusion_matrix.true_fake}</td><td class="hit">${OVERVIEW.confusion_matrix.true_true}</td></tr>
          </table>
        </div>

        <div class="section-title">Not built yet</div>
        <div class="side-block">
          <div class="roadmap-item next"><div class="dot"></div><div>Reddit / Telegram live collection — waiting on API credentials</div></div>

    </div>
    <footer>Source: ifnd_disaster_subset.parquet (894 rows) · Model: TF-IDF (1,926 features) + Logistic Regression · All figures computed, not illustrative.</footer>
  `;
}

function cardHTML(item, idx){
  const trueLabel = item.Label === 'TRUE' ? 'true' : 'fake';
  const prob = Math.round(item.pred_prob_true * 100);
  return `
    <div class="card${item.correct ? '' : ' wrong'}" data-idx="${idx}">
      <div class="card-top">
        <span class="exhibit">${item.Web || 'unknown'} · ${item.Category || '—'} · ${item.Date || 'n/a'}</span>
        <span class="stamp ${trueLabel}">${item.Label === 'TRUE' ? 'Verified True' : 'Debunked'}</span>
      </div>
      <p class="claim-text">${item.Statement}</p>
      <div class="verdict-row">
        <span>Model: <strong>${item.pred_label}</strong></span>
        <div class="prob-bar"><div class="prob-fill" style="width:${prob}%"></div></div>
        <span>${prob}%</span>
      </div>
      ${!item.correct ? `<div style="font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--amber); text-transform:uppercase; letter-spacing:0.05em; margin-top:0.45rem;">✗ misclassified</div>` : ''}
    </div>`;
}

function getFilteredFeed(){
  const { q, category, verdict } = state.filters;
  return FEED.filter((item, i) => {
    item.__idx = i;
    if (category !== 'all' && item.Category !== category) return false;
    if (verdict === 'true' && item.Label !== 'TRUE') return false;
    if (verdict === 'fake' && item.Label !== 'Fake') return false;
    if (verdict === 'wrong' && item.correct) return false;
    if (q && !item.Statement.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
}

function renderFeed(){
  const categories = [...new Set(FEED.map(i => i.Category))].sort();
  const filtered = getFilteredFeed();
  const shown = filtered.slice(0, state.feedLimit);

  return `

        <option value="all" ${state.filters.verdict==='all'?'selected':''}>All verdicts</option>
        <option value="true" ${state.filters.verdict==='true'?'selected':''}>Verified true</option>
        <option value="fake" ${state.filters.verdict==='fake'?'selected':''}>Debunked</option>
        <option value="wrong" ${state.filters.verdict==='wrong'?'selected':''}>Misclassified only</option>
      </select>
      <span class="count">${filtered.length} match${filtered.length===1?'':'es'}</span>
    </div>

    <div id="feed-cards">
      ${shown.length ? shown.map(item => cardHTML(item, item.__idx)).join('') : '<div class="empty">No claims match these filters.</div>'}
    </div>
    ${filtered.length > shown.length ? `<button class="load-more" id="load-more">Load more (${filtered.length - shown.length} remaining)</button>` : ''}
  `;
}

function renderDetail(){
  const item = FEED[state.selected];
  if (!item) return renderFeed();
  const res = scoreText(item.Statement);
  const trueLabel = item.Label === 'TRUE' ? 'true' : 'fake';

  return `
    <button class="back-link" id="back-to-feed">← Back to Case Feed</button>
    <div class="eyebrow">Exhibit detail</div>
    <h1>${item.Web || 'Unknown source'} — ${item.Category || 'Uncategorized'}</h1>

    <div class="detail-card">
      <span class="stamp ${trueLabel}">${item.Label === 'TRUE' ? 'Verified True' : 'Debunked'}</span>
      <p class="claim-text" style="font-size:17px; margin-top:0.8rem;">${item.Statement}</p>
      <div class="meta-row" style="margin-top:0.9rem;">
        <span>SOURCE: ${item.Web || 'n/a'}</span>
        <span>CATEGORY: ${item.Category || 'n/a'}</span>
        <span>DATE: ${item.Date || 'n/a'}</span>
        <span>MODEL VERDICT: ${item.pred_label}</span>
        <span>${item.correct ? '✓ correct' : '✗ misclassified'}</span>
      </div>

      <div class="gauge-wrap">
        ${gaugeSVG(res.prob)}
        <div style="flex:1; min-width:220px;">
          <div class="section-title" style="margin-bottom:0.6rem;">Why the model said this</div>
          <p style="font-size:13px; color:var(--ink-soft); margin:0 0 0.6rem;">Top words by contribution to the prediction (green pushes toward True, red pushes toward Fake):</p>
          <div>
            ${res.contributions.map(c => `<span class="token ${c.contrib>=0?'pos':'neg'}">${c.term} ${c.contrib>=0?'+':''}${c.contrib.toFixed(2)}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderTry(){
  return `
    <div class="eyebrow">Live inference</div>
    <h1>Try the real classifier</h1>
    <p class="sub">This runs the actual trained TF-IDF + Logistic Regression model client-side, on whatever text you enter. It was trained on 894 IFND disaster-news headlines only — expect it to struggle on casual social-media phrasing quite different in style from a news headline. That gap is the point of this page.</p>

    <div class="try-box">
      <textarea id="try-input" placeholder="e.g. Old video of 2019 Kerala floods being shared as visuals from the current Assam flooding">${state.tryText || ''}</textarea>
      <button class="analyze-btn" id="try-analyze">Run classifier</button>
      <div id="try-result"></div>
    </div>
  `;
}

function renderTryResult(text){
  const res = scoreText(text);
  return `
    <div class="try-result">
      <div class="gauge-wrap">
        ${gaugeSVG(res.prob, 120)}
        <div style="flex:1; min-width:220px;">
          <div class="section-title" style="margin-bottom:0.6rem;">Contributing terms (${res.matchedTerms} of your words are in the model's vocabulary)</div>
          ${res.matchedTerms === 0
            ? '<p style="font-size:13px; color:var(--ink-soft);">None of these words appeared in the training data — the model is guessing near its baseline rate.</p>'
            : `<div>${res.contributions.map(c => `<span class="token ${c.contrib>=0?'pos':'neg'}">${c.term} ${c.contrib>=0?'+':''}${c.contrib.toFixed(2)}</span>`).join('')}</div>`}
        </div>
      </div>
    </div>
  `;
}

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view || (state.view==='detail' && t.dataset.view==='feed')));
  const app = document.getElementById('app');
  if (state.view === 'overview') app.innerHTML = renderOverview();
  else if (state.view === 'feed') app.innerHTML = renderFeed();
  else if (state.view === 'detail') app.innerHTML = renderDetail();
  else if (state.view === 'try') app.innerHTML = renderTry();
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    state.view = t.dataset.view; state.selected = null; render();
  });

  if (state.view === 'feed'){
    document.getElementById('feed-search').oninput = (e) => { state.filters.q = e.target.value; state.feedLimit = 24; render(); document.getElementById('feed-search').focus(); document.getElementById('feed-search').setSelectionRange(e.target.value.length, e.target.value.length); };
    document.getElementById('feed-category').onchange = (e) => { state.filters.category = e.target.value; state.feedLimit = 24; render(); };
    document.getElementById('feed-verdict').onchange = (e) => { state.filters.verdict = e.target.value; state.feedLimit = 24; render(); };
    document.querySelectorAll('.card').forEach(c => c.onclick = () => { state.selected = parseInt(c.dataset.idx); state.view = 'detail'; render(); });
    const lm = document.getElementById('load-more');
    if (lm) lm.onclick = () => { state.feedLimit += 24; render(); };
  }
  if (state.view === 'detail'){
    document.getElementById('back-to-feed').onclick = () => { state.view = 'feed'; render(); };
  }
  if (state.view === 'try'){
    const btn = document.getElementById('try-analyze');
    const ta = document.getElementById('try-input');
    ta.oninput = () => { state.tryText = ta.value; };
    btn.onclick = () => {
      const text = ta.value.trim();
      if (!text) return;
      document.getElementById('try-result').innerHTML = renderTryResult(text);
    };
  }
}

render();
</script>
</body>
</html>
